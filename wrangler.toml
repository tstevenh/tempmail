# ====================================================================
# Open Temp Mail — Cloudflare Worker backend + website
# ====================================================================

name = "tempmail"
main = "src/worker.js"
compatibility_date = "2024-11-01"
account_id = "b574b9f3eb7c4f42e63776cd2601a979"

# Custom Domain: wrangler otomatis membuat DNS record + SSL saat deploy (mencegah error DNS NXDOMAIN).
routes = [
  { pattern = "opentempmail.com", custom_domain = true },
  { pattern = "www.opentempmail.com", custom_domain = true }
]

[vars]
# Bisa isi lebih dari satu domain, pisahkan dengan koma.
# Semua domain harus aktif Email Routing/catch-all ke Worker di Cloudflare.
MAIL_DOMAINS = "life-ware.com"
# Password owner untuk membuka dashboard (/dashboard) dan API admin.
# SECURITY: do NOT hardcode here (wrangler.toml is committed to git).
#   Production: run  `wrangler secret put DASHBOARD_PASSWORD`
#   Local dev:  set it in .dev.vars (gitignored)
# Code reads env.DASHBOARD_PASSWORD identically whether it's a secret or a var.
# Logo website + sumber favicon.ico otomatis (di-serve oleh Worker di /favicon.ico).
LOGO_URL = "https://i.imgur.com/XiiKJXd.png"
# PUBLIC_SITE="off" => opentempmail.com jadi BACKEND temp mail saja.
# Set "on" jika ingin website publik kembali tampil di domain ini.
PUBLIC_SITE = "on"
# SEO: canonical / Open Graph / sitemap base URL. MUST be your real https domain (no trailing slash).
SITE_URL = "https://opentempmail.com"
# Google AdSense publisher id WITHOUT the "ca-" prefix, e.g. "pub-1234567890123456".
# Leave empty until approved — ad units and ads.txt stay inactive while blank.
ADSENSE_PUB_ID = ""
# Public key only. Set TURNSTILE_SECRET and INBOX_SESSION_SECRET with
# `wrangler secret put`; never add either secret to this file.
TURNSTILE_SITE_KEY = "0x4AAAAAADzIDOck7Ooz2o-C"
TURNSTILE_EXPECTED_HOSTNAME = "opentempmail.com"
# Set to "kv" for the pre-cutover migration release, then switch to "d1"
# after /api/admin/migrate-kv reports matching counts.
MAIL_STORAGE_MODE = "d1"

# Auto Cleanup terjadwal: jalan tiap 6 jam (atur di dashboard → Auto Cleanup).
[triggers]
crons = ["0 */6 * * *"]

[[kv_namespaces]]
binding = "TEMPMAIL_KV"
id = "d610bae13f5b493d8978947a2b8f6571"

[[d1_databases]]
binding = "TEMPMAIL_DB"
database_name = "tempmail"
database_id = "1f6d6e4f-0974-4973-8441-46cf11f3b478"
migrations_dir = "migrations"

[[durable_objects.bindings]]
name = "INBOX_HUB"
class_name = "InboxHub"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["InboxHub"]

[[rules]]
type = "Text"
globs = ["**/*.html"]
fallthrough = true
